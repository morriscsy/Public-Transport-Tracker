<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080c">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<title>StationWise</title>
<meta name="apple-mobile-web-app-title" content="StationWise">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07080c;color:#f7f4ee;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
.app{max-width:430px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo3d{width:56px;height:56px;perspective:240px;flex:0 0 56px}
.logo-spin{width:56px;height:56px;transform-style:preserve-3d;animation:float3d 5.5s ease-in-out infinite}
.logo-spin svg{width:56px;height:56px;filter:drop-shadow(0 10px 14px rgba(255,77,58,.28))}
@keyframes float3d{
  0%{transform:rotateY(-18deg) rotateX(12deg) translateY(0)}
  50%{transform:rotateY(18deg) rotateX(6deg) translateY(-5px)}
  100%{transform:rotateY(-18deg) rotateX(12deg) translateY(0)}
}
.kicker{margin:0;color:#f0c36a;letter-spacing:.16em;font-size:10px}
h1{margin:2px 0 0;font-size:24px;letter-spacing:-.03em;font-weight:750}
.nowbox{margin-left:auto;text-align:right}
.now-time{font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.now-date{margin-top:3px;color:#9a958b;font-size:11px}
.sub{margin:0 0 10px;color:#9a958b;font-size:12px}
.row{display:flex;gap:8px;margin-bottom:10px}
.ghost{border:1px solid rgba(255,255,255,.12);background:#14161d;color:#f7f4ee;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:650}
.ghost.on{color:#f0c36a;border-color:rgba(240,195,106,.55)}
.search,.locbox{display:flex;gap:8px;background:#12141b;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px}
.search{position:relative}
.search input,.locbox input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:16px;padding:10px 8px;min-width:0}
.ph-track{position:absolute;left:14px;right:78px;top:50%;transform:translateY(-50%);overflow:hidden;pointer-events:none;height:18px}
.ph-track.off{display:none}
.ph-move{display:inline-block;white-space:nowrap;color:#7a756b;font-size:14px;animation:marq 14s linear infinite}
@keyframes marq{0%{transform:translateX(12%)}100%{transform:translateX(-70%)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2a1a12;color:#ffd7a8;border:1px solid #c45a12;border-radius:14px;padding:12px 16px;font-size:14px;max-width:86vw;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.search button,.locbox button{border:0;background:#ff4d3a;color:#fff;border-radius:12px;padding:0 14px;font-weight:700}
.panel{display:none;background:#12141b;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px;margin-bottom:10px}
.panel.on{display:block}
.quick,.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0;padding-bottom:2px}
.quick button,.tabs button{border:1px solid rgba(255,255,255,.1);background:transparent;color:#fff;border-radius:999px;padding:7px 12px;white-space:nowrap;font-size:13px}
.tabs button.on{background:#1e2330;color:#f0c36a;border-color:rgba(240,195,106,.4)}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;overflow:visible}
.regions button{border:1px solid rgba(255,255,255,.1);background:transparent;color:#c5bfb4;border-radius:999px;padding:6px 9px;white-space:nowrap;font-size:12px;flex:1 1 calc(33.33% - 6px);max-width:calc(33.33% - 4px);text-align:center}
.regions button.on{background:#14261d;color:#7dffc2;border-color:rgba(125,255,194,.55)}
.rchip{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#7dffc2;background:rgba(125,255,194,.12);border:1px solid rgba(125,255,194,.35);border-radius:999px;padding:1px 6px;vertical-align:middle}
.tagbar{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
#tags{flex:1;min-width:0}
.tag{background:#1a1d27;border-radius:999px;padding:5px 8px 5px 6px;display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;font-size:14px;border:1px solid rgba(240,195,106,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#fff}
.tag img,.tico,.tico img{pointer-events:none;-webkit-touch-callout:none;-webkit-user-select:none}
.tag.dim{opacity:.34;border-color:rgba(255,255,255,.08);filter:grayscale(.7);background:#101218;color:#8a857c}
.tag.glow{opacity:1;filter:none;border-color:#7dffc2;background:#14261d;animation:glowpulse 1.5s ease-in-out infinite;color:#b7c9be}
.tag.glow .tico{opacity:.78}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 1px rgba(125,255,194,.45),0 0 8px rgba(125,255,194,.4)}50%{box-shadow:0 0 0 1px rgba(125,255,194,.95),0 0 16px rgba(125,255,194,.8)}}
.tag .x{border:0;background:transparent;color:#9a958b;font-size:16px;padding:0 2px 0 4px;line-height:1}
#tags.editing{touch-action:none}
#tags.editing .tag{animation:jiggle .28s ease-in-out infinite alternate;cursor:grab;touch-action:none}
.tag .mv{display:none;border:0;background:#2a3140;color:#f0c36a;width:22px;height:22px;border-radius:50%;font-size:13px;line-height:22px;padding:0;font-weight:800}
#tags.editing .tag .mv{display:inline-flex;align-items:center;justify-content:center}
#tags.editing .tag:nth-child(2n){animation-delay:-.08s}
#tags.editing .tag:nth-child(3n){animation-delay:-.16s}
#tags.editing .tag.dragging{animation:none;opacity:.72;transform:scale(1.08);z-index:5;box-shadow:0 8px 18px rgba(0,0,0,.35)}
@keyframes jiggle{0%{transform:rotate(-1.4deg)}100%{transform:rotate(1.4deg)}}
#tagDone{display:none;border:0;background:#f0c36a;color:#1a1408;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:750;margin:0 0 6px auto;flex:0 0 auto}
#tagBar.editing #tagDone{display:inline-flex}
.tag .tico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.tag .tico svg{width:14px;height:14px}
.tag button{border:0;background:transparent;color:#9a958b;font-size:16px}
.msg{color:#9a958b;font-size:12px;min-height:16px}

.cardwrap{position:relative;overflow:hidden;border-radius:18px;margin:10px 0}
.cardwrap .card{margin:0;position:relative;z-index:1;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
.alertbtn{position:absolute;right:0;top:0;bottom:0;width:108px;border:0;color:#fff;font-weight:800;font-size:14px;z-index:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;line-height:1.25}
.alertbtn.start{background:#1f8a4c}
.alertbtn.cancel{background:#d64545}
.card{background:#14171f;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;margin:10px 0;transition:box-shadow .2s,border-color .2s}
.cardhead{cursor:pointer}
.chev{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.06);color:#c5bfb4;font-size:12px;margin-left:6px;transition:transform .35s ease,background .2s;flex:0 0 22px}
.card.open .chev{transform:rotate(180deg);background:rgba(125,255,194,.18);color:#7dffc2}
.stops-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1),opacity .28s ease;opacity:.0}
.card.open .stops-wrap{grid-template-rows:1fr;opacity:1}
.stops-inner{overflow:hidden}
.stops-title{font-size:12px;color:#9a958b;margin:10px 2px 4px;font-weight:650}
.stops-list{list-style:none;margin:0;padding:0 2px 4px;max-height:264px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stop-row{min-height:33px;box-sizing:border-box}
.stop-row{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;font-size:13px;color:#b7b2a8;position:relative}
.stop-row.past{color:#6d6962}
.stop-row.here{color:#ffb020;font-weight:800;text-shadow:0 0 8px rgba(255,176,32,.95),0 0 18px rgba(255,140,0,.7)}
.stop-row.busnow{color:#7dffc2;font-weight:800;text-shadow:0 0 8px rgba(125,255,194,.95),0 0 16px rgba(125,255,194,.55)}
.stop-row.pick{background:rgba(240,195,106,.12);border-radius:8px;color:#f0c36a}
.stop-row.pick .stop-dot{background:#f0c36a;box-shadow:0 0 0 4px rgba(240,195,106,.25)}
.stop-dot{width:10px;height:10px;border-radius:50%;background:#3a3f4a;margin-top:4px;flex:0 0 10px;position:relative;z-index:1}
.stop-row.here .stop-dot{background:#ffb020;box-shadow:0 0 0 4px rgba(255,176,32,.4),0 0 12px rgba(255,140,0,.85)}
.stop-row.busnow .stop-dot{background:#7dffc2;box-shadow:0 0 0 4px rgba(125,255,194,.35),0 0 12px rgba(125,255,194,.8)}
.stop-row.past .stop-dot{background:#5a564e}
.stop-row:not(:last-child) .stop-dot::after{content:"";position:absolute;left:4px;top:12px;width:2px;bottom:-16px;background:#2c3038}
.stop-row.here:not(:last-child) .stop-dot::after{background:#ffb020}
.stopn-hint{font-size:11px;color:#7a756b;margin-top:4px}
.card.watch{border-color:#7dffc2;box-shadow:0 0 0 1px #7dffc2,0 0 18px rgba(125,255,194,.55);animation:cardglow 1.6s ease-in-out infinite}
@keyframes cardglow{50%{box-shadow:0 0 0 1px #7dffc2,0 0 28px rgba(125,255,194,.85)}}
.top{display:flex;gap:10px;align-items:flex-start}
.ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;overflow:hidden;padding:0;background:#111}
.ico img,.tico img{width:100%;height:100%;object-fit:cover;display:block}
.tag .tico{overflow:hidden;padding:0}
.bus{font-size:clamp(22px,6.4vw,30px);font-weight:780;line-height:1}
.namerow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stopn{font-size:12px;font-weight:650;color:#c5bfb4;margin-top:6px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linechip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:4px;color:#fff}
.meta{color:#9a958b;font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.cardhead{display:flex;gap:8px;align-items:stretch}
.cardmain{flex:1;min-width:0}
.to{margin-top:2px;display:block;max-width:100%;color:#f0c36a;font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.to b{color:#fff;font-size:clamp(16px,4.2vw,19px);font-weight:780}
.times.mini{flex:0 0 58%;max-width:248px;margin-top:0;gap:5px;align-self:stretch}
.times.mini .slot{padding:10px 4px;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.times.mini .big{font-size:20px;margin:6px 0 4px;line-height:1}
.times.mini .lab{font-size:11px}
.times.mini .clk{font-size:12px}
.cardmap{position:relative;height:168px;width:100%;border-radius:14px;overflow:hidden;margin-top:10px;background:#1c2128;touch-action:none;z-index:2;-webkit-user-select:none;overscroll-behavior:contain}
.cardmap *{touch-action:none}
.cardmap .maplibregl-canvas{pointer-events:auto}
.cardmap .maplibregl-ctrl-attrib,.cardmap .maplibregl-ctrl-logo{display:none}
.cardmap canvas{image-rendering:auto}
.flip{transform:scaleX(-1);transform-origin:center}
.flowdot{width:8px;height:8px;border-radius:50%;background:#eafff6;box-shadow:0 0 6px 3px rgba(125,255,194,.95),0 0 14px 6px rgba(125,255,194,.55);pointer-events:none}
.veh{width:26px;height:66px;transform-origin:50% 50%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.veh svg{display:block;overflow:visible}
.herepin{pointer-events:none;position:absolute;left:8px;bottom:8px;z-index:12;max-width:78%;background:rgba(12,14,18,.82);border:1px solid rgba(240,195,106,.4);color:#f7f4ee;font-size:11px;font-weight:650;padding:6px 8px;border-radius:10px;line-height:1.35;pointer-events:none}
.herepin b{color:#f0c36a}
.youdot{width:14px;height:14px;border-radius:50%;background:#4da3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(77,163,255,.25)}
#suggest li{display:flex;align-items:center;gap:10px}
.times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.slot{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 4px;text-align:center}
.lab{font-size:10px;color:#9a958b}
.big{font-size:18px;font-weight:750;margin:4px 0 2px}
.soon .big{color:#7dffc2}
.wait .big{color:#f0c36a}
.sched .big{color:#c9b8a0}
.empty .big{color:#6b665e;font-size:13px}
.clk{font-size:10px;color:#9a958b}
.fine{color:#5d594f;font-size:11px;margin-top:14px}
#suggest,#locSuggest,#gateSuggest{list-style:none;margin:8px 0 0;padding:0;background:#12141b;border-radius:14px;display:none}
#suggest li,#locSuggest li,#gateSuggest li{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
#suggest small,#locSuggest small,#gateSuggest small{color:#9a958b;display:block;font-size:11px}
.hint{font-size:11px;color:#7a756b;margin:6px 0 0}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end;justify-content:center}
.gate.on{display:flex}
.gatebox{width:100%;max-width:430px;background:#161821;border-radius:22px 22px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.gatebox h2{margin:0 0 8px;font-size:22px}
.gatebox p{margin:0 0 14px;color:#c5bfb4;font-size:14px;line-height:1.45}
.gatebox .locbox{margin-bottom:10px}
.gbtn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#ff4d3a;color:#fff;margin-top:8px}
#feed{display:flex;flex-direction:column}
.topbar .row{margin-bottom:10px}
@media (min-width:740px){
  .regions button{flex:0 1 auto;max-width:none}
  .app{max-width:1100px;padding:16px 24px 40px}
  .brand{margin-bottom:6px}
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
  .topbar .sub{margin:0 8px 0 0;flex:0 1 auto}
  .topbar .row{margin:0}
  .topbar .search{flex:0 1 360px;max-width:360px;margin:0}
  .topbar #tags,.topbar .tabs{margin:0}
  .topbar .msg{min-height:0;margin:0 0 0 auto;font-size:11px}
  .topbar .panel{flex:1 1 100%}
  #feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .card{margin:0;height:100%}
  .cardmap{height:150px}
  .times.mini{max-width:260px}
}
@media (min-width:1180px){
  .app{max-width:1440px;padding:22px 28px 56px}
  #feed{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .cardmap{height:140px}
}
@media (min-width:740px) and (max-height:820px){
  .cardmap{height:120px}
  .times.mini .big{font-size:18px}
}
@media (max-width:739px) and (orientation:landscape){
  .app{max-width:100%;padding:10px 12px 24px}
  #feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cardmap{height:110px}
}

.guide{position:fixed;inset:0;z-index:90;background:rgba(6,8,12,.72);display:none;align-items:flex-end;justify-content:center;padding:16px}
.guide.on{display:flex}
.guidebox{width:min(440px,100%);background:#14171f;border:1px solid rgba(125,255,194,.35);border-radius:22px;padding:18px 16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.guidebox h3{margin:0 0 6px;font-size:18px}
.guidebox p{margin:0 0 12px;color:#c9c3b8;font-size:14px;line-height:1.45}
.gshot{width:100%;height:240px;object-fit:contain;object-position:center;border-radius:14px;margin:0 0 12px;background:#0e1116;border:1px solid rgba(255,255,255,.08)}
.locrow{position:relative;min-height:36px;margin:0 0 8px}
.locrow .sub{margin:0;padding-right:78px}
.helpbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);height:32px;padding:0 12px;border-radius:16px;border:0;background:#7dffc2;color:#10281f;font-weight:800;font-size:13px;z-index:5}
.gdots{display:flex;gap:6px;margin-bottom:12px}
.gdots i{width:7px;height:7px;border-radius:50%;background:#343842}
.gdots i.on{background:#7dffc2}
.gacts{display:flex;gap:8px}
.gacts button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:750}
.gskip{background:#22262e;color:#ddd}
.gnext{background:#1f8a4c;color:#fff}

.viewbar{display:flex;gap:8px;margin:8px 0 10px}
.viewbar button{flex:1;border:1px solid rgba(255,255,255,.12);background:#161821;color:#ddd;border-radius:12px;padding:9px;font-weight:700}
.viewbar button.on{background:#7dffc2;color:#10281f;border-color:#7dffc2}
#livemap{display:none;height:62vh;min-height:360px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#1c2128}
body.view-map #feed{display:none}
body.view-map #livemap{display:block}
.vbus{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.vbus .veh{transform:scale(.72);transform-origin:center bottom}
.vbus .tag{background:#111;color:#fff;border-radius:8px;padding:2px 6px;font-size:11px;font-weight:800;margin-top:-6px;border:1px solid rgba(255,255,255,.45)}
.maplibregl-popup-content{background:#14171f;color:#fff;border-radius:14px;padding:10px 12px;border:1px solid rgba(125,255,194,.4)}
.maplibregl-popup-tip{border-top-color:#14171f}
.bpop-h{font-weight:800;font-size:16px}
.bpop-to{color:#f0c36a;margin:2px 0 6px}
.bpop-stop{color:#c9c3b8;font-size:12px;margin-bottom:6px}
.bpop-times{display:flex;gap:6px}
.peta{background:#1c2128;border-radius:8px;padding:6px 8px;text-align:center;min-width:58px}
.peta span{display:block;font-size:10px;color:#9a958b}
.peta b{font-size:15px;color:#7dffc2}

.nowbox{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.nowbox .clockcol{display:flex;flex-direction:column;align-items:flex-end}
.viewtoggle{display:flex;background:#161821;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;gap:2px}
.viewtoggle button{border:0;background:transparent;color:#c9c3b8;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;cursor:pointer}
.viewtoggle button.on{background:#7dffc2;color:#10281f}
</style>

function dist(a,b,c,d){
  var R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dphi=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
  var x=Math.sin(dphi/2)*Math.sin(dphi/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(x));
}

function findMtr(q){
  var raw=String(q||"").trim(), u=norm(q), hits=[];
  MTR_STATIONS.forEach(function(s){
    if(s.c===u || s.zh===raw || s.en.toUpperCase().replace(/\s+/g,"")===u || (raw.length>=2 && s.zh.indexOf(raw)>=0)) hits.push(s);
  });
  if(LINE_NAME[u]) MTR_STATIONS.forEach(function(s){ if(s.ln.indexOf(u)>=0) hits.push(s); });

}
function renderSuggest(q){
  var box=$("suggest");

  Object.keys(state.kmbRoutes).forEach(function(r){if(r.indexOf(u)===0) hits.push({t:"bus",k:r,hint:"九巴／龍運"});});
  Object.keys(state.ctbRoutes).forEach(function(r){if(r.indexOf(u)===0 && !hits.some(function(h){return h.k===r;})) hits.push({t:"bus",k:r,hint:"城巴"});});
  findMtr(q).forEach(function(s){hits.push({t:"mtr",k:s.c,hint:"港鐵"});});
  hits=hits.slice(0,8);
  if(!hits.length){box.style.display="none";return;}
  box.style.display="block";
  box.innerHTML=hits.map(function(h){
    var lab=h.t==="mtr"?((MTR_BY[h.k]||{}).zh||h.k):h.k;
    return '<li data-t="'+h.t+'" data-k="'+h.k+'">'+tagIcon(h)+'<span><strong>'+lab+'</strong><small>'+h.hint+'</small></span></li>';
  }).join("");

function parseQuery(raw){
  var q=String(raw||"").trim(); if(!q) return null;
  var mtr=findMtr(q);
  if(mtr.length===1) return {t:"mtr",k:mtr[0].c};
  if(mtr.length>1) return {t:"mtr",k:mtr[0].c,many:mtr};
  return {t:"bus",k:norm(q)};
}

    var canvas=el.querySelector("canvas");
    var dead=!canvas || canvas.width<20 || canvas.clientWidth<20;
    if(el._swMap && el._swMap.getStyle && !dead){ updateLiveMap(el._swMap,c); bindMapTouch(el._swMap, el); try{el._swMap.resize(); el._swMap.triggerRepaint();}catch(e){} keep.push(el._swMap); return; }
    if(el._swMap){ try{el._swMap.remove();}catch(e){} el._swMap=null; }
    if(el._swMap){ try{el._swMap.remove();}catch(e){} el._swMap=null; }
    var parts0=routeParts(c);
    var path=c.path&&c.path.length?c.path:[{lat:c.lat,lng:c.lng}];
    var prog=parts0.prog;
    var pos=parts0.pos;
    var hd=headingAt(path,prog);
    var map=new maplibregl.Map({
      container:el,

      center:[pos.lng,pos.lat],
      zoom:13.6,
      attributionControl:false,
      dragPan:true,
      dragRotate:false,
      touchZoomRotate:true,
      touchPitch:false,
            pitchWithRotate:false,
      pixelRatio:Math.min(window.devicePixelRatio||2, 3)
    });
    map.on("dragstart", function(){ map._holdView=1; });
    map.on("zoomstart", function(){ map._holdView=1; });
    bindMapTouch(map, el);
    map.on("load",function(){
      tuneMap(map);
      try{ map.resize(); }catch(e){}
      bindMapTouch(map, el);
      setTimeout(function(){ bindMapTouch(map, el); }, 200);
      if(path.length>1 || (c.ahead&&c.ahead.length>1)){
        map._flowPath=parts0.upcoming;
        map.addSource("passed",{type:"geojson",data:lineOf(parts0.passed)});
        map.addSource("upcoming",{type:"geojson",data:lineOf(parts0.upcoming)});
        map.addLayer({id:"passed",type:"line",source:"passed",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#8b8b92","line-width":4,"line-opacity":0.85}});
        map.addLayer({id:"upcoming",type:"line",source:"upcoming",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#7dffc2","line-width":5,"line-opacity":0.35}});
        map.addLayer({id:"upcomingglow",type:"line",source:"upcoming",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#7dffc2","line-width":2.2,"line-opacity":0.9}});

        body.innerHTML=busIcon(hd); body.dataset.view=busView(hd);

    var pin=document.createElement("div");
    pin.className="herepin";
    pin.innerHTML=nearHint(path,pos,c.name);
    el.appendChild(pin);

    var host=el.closest('.card'); if(host) host._swMap=map;
    map.on('load',function(){ map._loaded=1; if(map._focusAt){ try{ map.jumpTo({center:map._focusAt, zoom:15.6}); }catch(e){} } });
    keep.push(map);
  });
  miniMaps.forEach(function(m){ if(keep.indexOf(m)<0){ try{m.remove();}catch(e){} } });

function refresh(){
  if(state.editing) return;
  if(!state.loc){ say("請先設定常用位置或開啟定位"); return; }
  if(state.busy){state.needRefresh=true; return;}
  state.busy=true; renderTags();
  if(!state.items.length){state.cards=[]; paint(); state.busy=false; return;}
  var jobs=state.items.filter(function(x){return x.t==="bus";}).map(function(x){
    return Promise.all([kmbNearby(x.k).catch(function(){return [];}),ctbNearby(x.k).catch(function(){return [];})]).then(function(arr){
      if((arr[0]&&arr[0].length)&&(arr[1]&&arr[1].length)) jointFound[String(x.k).toUpperCase()]=1;
      var nearby=arr[0].concat(arr[1]).sort(function(a,b){return a.dist-b.dist;});
      var used={},picked=[];
      nearby.forEach(function(item){
        var dest=(item.etas&&item.etas[0]&&item.etas[0].dest)||item.dest||"";
        var k=item.co+"-"+item.route+"-"+item.bound+"-"+dest;
        if(used[k]) return; used[k]=1; picked.push(item);
      });
      return Promise.all(picked.map(function(item){return busEtas(item).then(function(e){item.etas=e;return item;});}));
    });
  });
  var mtrJobs=state.items.filter(function(x){return x.t==="mtr";}).map(function(x){return mtrCardsFor(x.k).catch(function(){return [];});});
  Promise.all(jobs.concat(mtrJobs)).then(function(groups){
    var cards=[].concat.apply([],groups).filter(function(c){return c&&c.etas;});
    function destKey(c){
      var d=(c.etas[0]&&c.etas[0].dest)||c.dest||"";
      return String(d).replace(/[()（）\s]/g,"").replace(/裕民坊|西區|東/g,"");
    }
    function liveScore(c){
      var live=(c.etas||[]).filter(function(e){return e&&e.eta&&!e.sched;}).length;
      return live?0:1;
    }
    var uniq={}, slim=[];
    cards.forEach(function(c){
      var k=c.kind==="mtr"?("mtr-"+c.stopId+"-"+c.route+"-"+destKey(c)):(c.co+"-"+c.route+"-"+c.bound+"-"+destKey(c));
      var old=uniq[k];
      if(!old){ uniq[k]=c; slim.push(c); return; }
      if(liveScore(c)<liveScore(old) || (liveScore(c)===liveScore(old) && c.dist<old.dist)){
        slim[slim.indexOf(old)]=c; uniq[k]=c;
      }
    });
    cards=slim.filter(function(c){
      if(c.kind!=="bus") return true;
      return (c.etas||[]).some(function(e){return e&&e.eta;});
    });
    cards.sort(function(a,b){
      var ra=String(a.route||""), rb=String(b.route||"");
      if(ra!==rb){
        var na=parseInt(ra,10), nb=parseInt(rb,10);
        if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
        return ra.localeCompare(rb,"zh-HK",{numeric:true});
      }
      function firstMin(c){
        var e=c.etas&&c.etas[0];
        if(!e) return 99999;
        if(e.ttnt!=null&&e.ttnt!=="") return Number(e.ttnt);
        if(e.eta) return (new Date(e.eta)-Date.now())/60000;
        return 99999;
      }
      return firstMin(a)-firstMin(b);
    });
    var available={};
    cards.forEach(function(c){
      if(c.kind==="bus" && c.dist<=HARD_CAP) available["bus|"+String(c.route).toUpperCase()]=1;
      if(c.kind==="mtr" && c.dist<=MTR_MAX) available["mtr|"+c.stopId]=1;
    });
    state.available=available;
    var changed=false;
    state.items.forEach(function(it){
      if(isOn(it) && !hasNearby(it)){ it.on=false; changed=true; }
    });
    if(changed) persist();
    state.cards=cards; renderTags(); paint();
    say("已更新 "+new Date().toLocaleTimeString("zh-HK",{hour12:false})+" · 只顯示完整分鐘");
  }).catch(function(err){
    say("更新未完成："+(err&&err.message?err.message:"網絡")+" · 已保留現有班次");
    if(state.cards&&state.cards.length) paint();
  }).then(function(){state.busy=false; if(state.needRefresh){state.needRefresh=false; refresh();}});
}

function busPopupHtml(c, hint){

function renderLiveMap(){
  if(!window.maplibregl) return;
  var el=$("livemap"); if(!el) return;
  if(!el._map){
    var center=state.loc?[state.loc.lng,state.loc.lat]:[114.17,22.32];

var liveGen=0;
function placeLive(map){
  var gen=++liveGen;
  if(!map || !map.getStyle || (!map._loaded && !(map.isStyleLoaded&&map.isStyleLoaded()))){
    if(map) map.once("load", function(){ map._loaded=1; placeLive(map); });
    return;
  }
  map._loaded=1;
  var cards=liveCards();
  if(!map.getSource("live-up")){
    map.addSource("live-passed",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addSource("live-up",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({id:"live-passed",type:"line",source:"live-passed",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#8b8b92","line-width":5,"line-opacity":0.85}});
    map.addLayer({id:"live-up-glow",type:"line",source:"live-up",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#7dffc2","line-width":8,"line-opacity":0.35}});
    map.addLayer({id:"live-up",type:"line",source:"live-up",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#19c37d","line-width":4,"line-opacity":1}});
  }
  Object.keys(map._marks||{}).forEach(function(k){ try{ map._marks[k].remove(); }catch(e){} });
  map._marks={};
  var bounds=new maplibregl.LngLatBounds();
  var any=false, passed=[], upcoming=[];
  var jobs=[];
  cards.forEach(function(c, idx){
    var parts=routeParts(c);
    var pos=parts.pos||{lat:c.lat,lng:c.lng};
    if(!pos||!pos.lng) return;
    any=true;
    var path=c.path&&c.path.length?c.path:[{lat:c.lat,lng:c.lng,name:c.name||""}];
    var up=parts.upcoming||[];
    var back=parts.passed||[];
    [pos].concat(up.slice(0,6)).forEach(function(p){ if(p&&p.lng) bounds.extend([p.lng,p.lat]); });
    jobs.push(Promise.all([roadLine(back.concat([pos])), roadLine(up)]).then(function(arr){
      if(gen!==liveGen) return;
      var roadBack=arr[0]&&arr[0].length>1?arr[0]:back;
      var roadUp=arr[1]&&arr[1].length>1?arr[1]:up;
      var roadAll=roadBack.concat(roadUp);
      function nearestOn(line, p){
        if(!line||!line.length) return p;
        var best=line[0], bd=1e9;
        for(var i=1;i<line.length;i++){
          var a=line[i-1], b=line[i];
          var dx=b.lng-a.lng, dy=b.lat-a.lat, l2=dx*dx+dy*dy;
          var t=l2?Math.max(0,Math.min(1,((p.lng-a.lng)*dx+(p.lat-a.lat)*dy)/l2)):0;
          var q={lng:a.lng+dx*t, lat:a.lat+dy*t};
          var d=(q.lng-p.lng)*(q.lng-p.lng)+(q.lat-p.lat)*(q.lat-p.lat);
          if(d<bd){ bd=d; best=q; }
        }
        return best;
      }
      var roadPos=nearestOn(roadAll.length>1?roadAll:roadUp, pos)||roadUp[0]||pos;
      if(passed.length||upcoming.length||true){
        if(roadBack.length>1) passed.push({type:"Feature",properties:{i:idx},geometry:{type:"LineString",coordinates:roadBack.map(function(p){return [p.lng,p.lat];})}});
        if(roadUp.length>1) upcoming.push({type:"Feature",properties:{i:idx},geometry:{type:"LineString",coordinates:roadUp.map(function(p){return [p.lng,p.lat];})}});
      }
      var hd=0; try{ hd=headingAt(roadUp.length>1?roadUp:path, 0.05); }catch(e){}
      var hint=""; try{ hint=nearHint(path,pos,c.name).replace(/<[^>]+>/g,""); }catch(e){}
      var d=document.createElement("div");
      d.className="vbus";
      var destLab=(c.etas&&c.etas[0]&&c.etas[0].dest)||c.dest||"";
      d.innerHTML='<div class="veh">'+busIcon(hd)+'</div><div class="tag">'+(c.route||"")+' '+(c.co==="KMB"?"九巴":"城巴")+(destLab?'<br>往 '+destLab:"")+'</div>';
      var pop=new maplibregl.Popup({offset:28, closeButton:true, maxWidth:"280px"}).setHTML(busPopupHtml(c, hint));
      var mk=new maplibregl.Marker({element:d, anchor:"bottom"}).setLngLat([roadPos.lng,roadPos.lat]).setPopup(pop).addTo(map);
      var hideT=null;
      d.addEventListener("mouseenter", function(){ clearTimeout(hideT); if(!pop.isOpen()) pop.setLngLat(mk.getLngLat()).addTo(map); });
      d.addEventListener("mouseleave", function(){ hideT=setTimeout(function(){ if(pop.isOpen()) pop.remove(); }, 280); });
      pop.on("open", function(){
        var el=pop.getElement(); if(!el) return;
        el.addEventListener("mouseenter", function(){ clearTimeout(hideT); });
        el.addEventListener("mouseleave", function(){ hideT=setTimeout(function(){ if(pop.isOpen()) pop.remove(); }, 200); });
      });
      map._marks[idx]=mk;
      bounds.extend([roadPos.lng,roadPos.lat]);
    }));
  });
  function scaleBuses(){
    var z=map.getZoom();
    var sc=Math.max(0.32, Math.min(0.9, (z-10.5)/5));
    Object.keys(map._marks||{}).forEach(function(k){
      var el=map._marks[k]&&map._marks[k].getElement&&map._marks[k].getElement();
      if(!el) return;
      var veh=el.querySelector(".veh");
      if(veh) veh.style.transform="scale("+sc+")";
    });
  }
  if(!map._scaleBound){ map._scaleBound=1; map.on("zoom", scaleBuses); }
  Promise.all(jobs).then(function(){
    if(gen!==liveGen) return;
    try{ map.getSource("live-passed").setData({type:"FeatureCollection",features:passed}); }catch(e){}
    try{ map.getSource("live-up").setData({type:"FeatureCollection",features:upcoming}); }catch(e){}
    scaleBuses();
    if(any && !map._userMoved){ try{ map.fitBounds(bounds, {padding:70, maxZoom:14, duration:500}); }catch(e){} }
  });
  if(state.loc){
    bounds.extend([state.loc.lng,state.loc.lat]);
    if(!map._you){
      var y=document.createElement("div"); y.className="youdot";
      map._you=new maplibregl.Marker({element:y, anchor:"center"}).setLngLat([state.loc.lng,state.loc.lat]).addTo(map);
    } else map._you.setLngLat([state.loc.lng,state.loc.lat]);
  }
  var note=map.getContainer().querySelector(".mapcount");
  if(!note){ note=document.createElement("div"); note.className="mapcount"; note.style.cssText="position:absolute;left:10px;bottom:10px;z-index:5;background:#111;color:#fff;border-radius:10px;padding:4px 8px;font-size:12px"; map.getContainer().appendChild(note); }
  note.textContent="顯示 "+cards.length+" 架車 · 撳圖示睇到站";
  if(any && !map._userMoved){
    try{ map.fitBounds(bounds, {padding:70, maxZoom:14, duration:500}); }catch(e){}
  }
}
