<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080c">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>刻到 HAKDOU</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07080c;color:#f7f4ee;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
.app{max-width:430px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.logo3d{width:56px;height:56px;perspective:240px;flex:0 0 56px}
.logo-spin{width:56px;height:56px;transform-style:preserve-3d;animation:float3d 5.5s ease-in-out infinite}
.logo-spin svg{width:56px;height:56px;filter:drop-shadow(0 10px 14px rgba(255,77,58,.28))}
@keyframes float3d{
  0%{transform:rotateY(-18deg) rotateX(12deg) translateY(0)}
  50%{transform:rotateY(18deg) rotateX(6deg) translateY(-5px)}
  100%{transform:rotateY(-18deg) rotateX(12deg) translateY(0)}
}
.kicker{margin:0;color:#f0c36a;letter-spacing:.16em;font-size:10px}
h1{margin:2px 0 0;font-size:30px;letter-spacing:-.04em}
.nowbox{margin-left:auto;text-align:right}
.now-time{font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.now-date{margin-top:3px;color:#9a958b;font-size:11px}
.sub{margin:0 0 10px;color:#9a958b;font-size:12px}
.row{display:flex;gap:8px;margin-bottom:10px}
.ghost{border:1px solid rgba(255,255,255,.12);background:#14161d;color:#f7f4ee;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:650}
.ghost.on{color:#f0c36a;border-color:rgba(240,195,106,.55)}
.search,.locbox{display:flex;gap:8px;background:#12141b;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:6px}
.search{position:relative}
.search input,.locbox input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:16px;padding:10px 8px;min-width:0}
.ph-track{position:absolute;left:14px;right:78px;top:50%;transform:translateY(-50%);overflow:hidden;pointer-events:none;height:18px}
.ph-track.off{display:none}
.ph-move{display:inline-block;white-space:nowrap;color:#7a756b;font-size:14px;animation:marq 14s linear infinite}
@keyframes marq{0%{transform:translateX(12%)}100%{transform:translateX(-70%)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2a1a12;color:#ffd7a8;border:1px solid #c45a12;border-radius:14px;padding:12px 16px;font-size:14px;max-width:86vw;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.search button,.locbox button{border:0;background:#ff4d3a;color:#fff;border-radius:12px;padding:0 14px;font-weight:700}
.panel{display:none;background:#12141b;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px;margin-bottom:10px}
.panel.on{display:block}
.quick,.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0;padding-bottom:2px}
.quick button,.tabs button{border:1px solid rgba(255,255,255,.1);background:transparent;color:#fff;border-radius:999px;padding:7px 12px;white-space:nowrap;font-size:13px}
.tabs button.on{background:#1e2330;color:#f0c36a;border-color:rgba(240,195,106,.4)}
.tag{background:#1a1d27;border-radius:999px;padding:5px 8px 5px 6px;display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;font-size:14px;border:1px solid rgba(240,195,106,.35)}
.tag.dim{opacity:.34;border-color:transparent;filter:grayscale(.4)}
.tag .tico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.tag .tico svg{width:14px;height:14px}
.tag button{border:0;background:transparent;color:#9a958b;font-size:16px}
.msg{color:#9a958b;font-size:12px;min-height:16px}
.card{background:#14171f;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;margin:10px 0}
.top{display:flex;gap:10px;align-items:flex-start}
.ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.ico svg{width:24px;height:24px}
.kmb{background:#8b1e1e}.ctb{background:#c45a12}
.bus{font-size:clamp(22px,6.4vw,30px);font-weight:780;line-height:1}
.namerow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stopn{font-size:clamp(14px,3.8vw,16px);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linechip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:4px;color:#fff}
.meta{color:#9a958b;font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.cardhead{display:flex;gap:8px;align-items:stretch}
.cardmain{flex:1;min-width:0}
.to{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:#2a2318;border:1px solid rgba(240,195,106,.45);color:#f0c36a;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px}
.to b{color:#fff;font-size:15px;font-weight:780}
.times.mini{flex:0 0 58%;max-width:248px;margin-top:0;gap:5px;align-self:stretch}
.times.mini .slot{padding:10px 4px;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.times.mini .big{font-size:20px;margin:6px 0 4px;line-height:1}
.times.mini .lab{font-size:11px}
.times.mini .clk{font-size:12px}
.cardmap{height:168px;width:100%;border-radius:14px;overflow:hidden;margin-top:10px;background:#1c2128}
.cardmap .leaflet-control-attribution{display:none}
.veh{width:28px;height:16px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.youdot{width:14px;height:14px;border-radius:50%;background:#4da3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(77,163,255,.25)}
#suggest li{display:flex;align-items:center;gap:10px}
.times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.slot{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 4px;text-align:center}
.lab{font-size:10px;color:#9a958b}
.big{font-size:18px;font-weight:750;margin:4px 0 2px}
.soon .big{color:#7dffc2}
.wait .big{color:#f0c36a}
.sched .big{color:#c9b8a0}
.empty .big{color:#6b665e;font-size:13px}
.clk{font-size:10px;color:#9a958b}
.fine{color:#5d594f;font-size:11px;margin-top:14px}
#suggest,#locSuggest,#gateSuggest{list-style:none;margin:8px 0 0;padding:0;background:#12141b;border-radius:14px;display:none}
#suggest li,#locSuggest li,#gateSuggest li{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
#suggest small,#locSuggest small,#gateSuggest small{color:#9a958b;display:block;font-size:11px}
.hint{font-size:11px;color:#7a756b;margin:6px 0 0}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end;justify-content:center}
.gate.on{display:flex}
.gatebox{width:100%;max-width:430px;background:#161821;border-radius:22px 22px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.gatebox h2{margin:0 0 8px;font-size:22px}
.gatebox p{margin:0 0 14px;color:#c5bfb4;font-size:14px;line-height:1.45}
.gatebox .locbox{margin-bottom:10px}
.gbtn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#ff4d3a;color:#fff;margin-top:8px}
</style>
</head>

function norm(s){return String(s||"").trim().toUpperCase().replace(/\s+/g,"");}
function dist(a,b,c,d){
  var R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dphi=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
  var x=Math.sin(dphi/2)*Math.sin(dphi/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(x));
}

function findMtr(q){
  var raw=String(q||"").trim(), u=norm(q), hits=[];
  MTR_STATIONS.forEach(function(s){
    if(s.c===u || s.zh===raw || s.en.toUpperCase().replace(/\s+/g,"")===u || (raw.length>=2 && s.zh.indexOf(raw)>=0)) hits.push(s);
  });
  if(LINE_NAME[u]) MTR_STATIONS.forEach(function(s){ if(s.ln.indexOf(u)>=0) hits.push(s); });
  var seen={}; return hits.filter(function(s){if(seen[s.c])return 0;seen[s.c]=1;return 1;});
}
function renderSuggest(q){
  var box=$("suggest");
  if(!q){box.style.display="none";return;}
  var hits=[], u=norm(q);
  Object.keys(state.kmbRoutes).forEach(function(r){if(r.indexOf(u)===0) hits.push({t:"bus",k:r,hint:"九巴／龍運"});});
  Object.keys(state.ctbRoutes).forEach(function(r){if(r.indexOf(u)===0 && !hits.some(function(h){return h.k===r;})) hits.push({t:"bus",k:r,hint:"城巴"});});
  findMtr(q).forEach(function(s){hits.push({t:"mtr",k:s.c,hint:"港鐵"});});
  hits=hits.slice(0,8);
  if(!hits.length){box.style.display="none";return;}
  box.style.display="block";
  box.innerHTML=hits.map(function(h){
    var lab=h.t==="mtr"?((MTR_BY[h.k]||{}).zh||h.k):h.k;
    return '<li data-t="'+h.t+'" data-k="'+h.k+'">'+tagIcon(h)+'<span><strong>'+lab+'</strong><small>'+h.hint+'</small></span></li>';
  }).join("");
}
function addItem(t,k){
  if(!k) return;
  state.items=state.items.filter(function(x){return !(x.t===t&&x.k===k);});
  state.items.unshift({t:t,k:k});
  state.items=state.items.slice(0,16);
  persist(); renderTags();
  $("q").value=""; $("suggest").style.display="none";
  say("已加入 "+labelOf({t:t,k:k}));
  refresh();
}
function parseQuery(raw){
  var q=String(raw||"").trim(); if(!q) return null;
  var mtr=findMtr(q);
  if(mtr.length===1) return {t:"mtr",k:mtr[0].c};
  if(mtr.length>1) return {t:"mtr",k:mtr[0].c,many:mtr};
  return {t:"bus",k:norm(q)};
}

function pickNearby(list){
  var byBound={}, out=[];
  list.filter(function(x){return x.dist<=HARD_CAP;}).forEach(function(x){
    var k=x.bound+"-"+(x.dest||"");
    if(!byBound[k] || x.dist<byBound[k].dist) byBound[k]=x;
  });
  Object.keys(byBound).forEach(function(k){out.push(byBound[k]);});
  return out.sort(function(a,b){return a.dist-b.dist;});
}

function nameFromCoords(lat,lng,done){
  var nearest=null, nd=1e9;
  POIS.concat(MTR_STATIONS.map(function(s){return {name:s.zh+"站",lat:s.lat,lng:s.lng};})).forEach(function(p){
    var d=dist(lat,lng,p.lat,p.lng);
    if(d<nd){nd=d; nearest=p;}
  });
  var fallback=(nearest&&nd<350)?nearest.name:"即時位置";
  fetch("https://photon.komoot.io/reverse?lang=zh&lon="+lng+"&lat="+lat).then(function(r){return r.json();}).then(function(j){
    var p=(j.features&&j.features[0]&&j.features[0].properties)||{};
    var n=p.name||p.street||fallback;
    var extra=[p.district,p.city].filter(Boolean).join(" ");
    done(extra&&n.indexOf(extra)<0?(n+" · "+extra):n);
  }).catch(function(){done(fallback);});
}
function applyGps(pos){
  state.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
  state.mode="gps";
  $("gpsBtn").classList.add("on"); $("homeBtn").classList.remove("on");
  $("locPanel").classList.remove("on");
  $("locLine").textContent="已用即時定位 · 讀取地名中";
  nameFromCoords(state.loc.lat,state.loc.lng,function(n){
    $("locLine").textContent="已用即時定位 · "+n;
    if(!state.home) saveHome({name:n,lat:state.loc.lat,lng:state.loc.lng});
  });
  say("定位成功");
  refresh();
}
function useGps(){
  if(!window.isSecureContext){say("定位需要 https（請用 GitHub Pages 連結，唔好開本機檔）。");return;}
  if(!navigator.geolocation){say("此瀏覽器不支援定位");return;}
  $("locPanel").classList.remove("on");
  say("正在要求定位…請撳允許");
  var opts={enableHighAccuracy:true,timeout:20000,maximumAge:15000};
  navigator.geolocation.getCurrentPosition(applyGps,function(err){
    navigator.geolocation.getCurrentPosition(applyGps,geoError,{enableHighAccuracy:false,timeout:25000,maximumAge:60000});
  },opts);
}

function softHit(hay,q){
  hay=String(hay||"").toLowerCase().replace(/['’]/g,"");
  q=String(q||"").toLowerCase().replace(/['’]/g,"").replace(/\s+/g," ").trim();
  if(!q) return false;
  if(hay.indexOf(q)>=0) return true;
  return q.split(" ").every(function(w){return w && hay.indexOf(w)>=0;});
}
function localPlaces(q){
  var out=[];
  POIS.forEach(function(p){
    var blob=[p.name,p.en,p.aka,p.hint].join(" ");
    if(softHit(blob,q)) out.push(p);
  });
  MTR_STATIONS.forEach(function(s){
    if(softHit(s.zh+" "+s.en+" "+s.c+"站",q))
      out.push({name:s.zh+"站",en:s.en+" Station",lat:s.lat,lng:s.lng,hint:"港鐵"});
  });
  return out;
}
function inHK(lat,lng){return lat>22.12&&lat<22.58&&lng>113.75&&lng<114.52;}
function searchPlace(q,opt){
  opt=opt||{};
  q=String(q||"").trim();
  if(!q){ if(!opt.live) toast("請輸入屋苑、地標或車站",true); return; }
  var local=localPlaces(q);
  if(local.length) showPlaces(local,true);
  else if(!opt.live) say("搜尋地點中…");
  var url="https://photon.komoot.io/api/?limit=8&lang=en&bbox=113.8,22.15,114.45,22.58&q="+encodeURIComponent(q);
  fetch(url).then(function(r){return r.json();}).then(function(j){
    (j.features||[]).forEach(function(f){
      var c=f.geometry&&f.geometry.coordinates; if(!c) return;
      if(!inHK(c[1],c[0])) return;
      var p=f.properties||{};
      var name=p.name||q;
      var hint=[p.street,p.district,p.city].filter(Boolean).join(" · ");
      local.push({name:name,en:p.name,lat:c[1],lng:c[0],hint:hint||"地圖搜尋"});
    });
    var seen={}, out=[];
    local.forEach(function(p){var k=p.name+Math.round(p.lat*400); if(seen[k])return; seen[k]=1; out.push(p);});
    showPlaces(out,opt.live);
  }).catch(function(){ showPlaces(local,opt.live); });
}

function loadCatalog(){
  return Promise.all([
    getJson(KMB+"/route"),

  ]).then(function(arr){

      state.kmbRoutes[k].push(r);

function getKmbStop(id){
  if(state.kmbStops[id]) return Promise.resolve(state.kmbStops[id]);
  return getJson(KMB+"/stop/"+id).then(function(j){ if(j.data) state.kmbStops[id]=j.data; return j.data||null; }).catch(function(){return null;});
}
function kmbNearby(route){
  var variants=state.kmbRoutes[route]||[{bound:"O",service_type:"1"},{bound:"I",service_type:"1"}];
  var tasks=variants.map(function(v){
    var dir=v.bound==="I"?"inbound":"outbound";
    return getJson(KMB+"/route-stop/"+route+"/"+dir+"/"+(v.service_type||"1")).then(function(j){return {v:v,rows:j.data||[]};}).catch(function(){return {v:v,rows:[]};});
  });
  return Promise.all(tasks).then(function(parts){
    var ids=[]; parts.forEach(function(p){p.rows.forEach(function(rs){if(ids.indexOf(rs.stop)<0) ids.push(rs.stop);});});
    return Promise.all(ids.map(getKmbStop)).then(function(){
      var all=[],seen={};
      parts.forEach(function(p){
        var path=[];
        p.rows.forEach(function(rs){
          var stop=state.kmbStops[rs.stop]; if(!stop) return;
          var d=dist(state.loc.lat,state.loc.lng,Number(stop.lat),Number(stop.long));
          var key=rs.stop+"-"+p.v.bound; if(seen[key]) return; seen[key]=1;
          path.push({lat:Number(stop.lat),lng:Number(stop.long)});
          all.push({kind:"bus",co:"KMB",coName:"九巴／龍運",route:route,stopId:rs.stop,name:stop.name_tc,nameEn:stop.name_en,lat:Number(stop.lat),lng:Number(stop.long),path:path.slice(-14),dist:Math.round(d),bound:p.v.bound,serviceType:String(p.v.service_type||"1"),dest:p.v.dest_tc||""});
        });
      });
      all.sort(function(a,b){return a.dist-b.dist;});
      return pickNearby(all);
    });
  });
}
var ctbStopCache={};
function ctbNearby(route){

  return metaP.then(function(meta){
    return Promise.all(["outbound","inbound"].map(function(dir){
      return getJson(CTB+"/route-stop/CTB/"+route+"/"+dir).then(function(j){return {dir:dir,rows:j.data||[]};}).catch(function(){return {dir:dir,rows:[]};});
    })).then(function(parts){
      var ids=[]; parts.forEach(function(p){p.rows.forEach(function(rs){if(ids.indexOf(rs.stop)<0) ids.push(rs.stop);});});
      return Promise.all(ids.map(function(id){
        if(ctbStopCache[id]) return Promise.resolve(ctbStopCache[id]);
        return getJson(CTB+"/stop/"+id).then(function(j){ctbStopCache[id]=j.data;return j.data;}).catch(function(){return null;});
      })).then(function(){
        var out=[],seen={};
        parts.forEach(function(p){
          var bound=p.dir==="inbound"?"I":"O";
          var path=[];
          p.rows.forEach(function(rs){
            var stop=ctbStopCache[rs.stop]; if(!stop||!stop.lat) return;
            var d=dist(state.loc.lat,state.loc.lng,Number(stop.lat),Number(stop.long));
            var key=rs.stop+"-"+bound; if(seen[key]) return; seen[key]=1;
            path.push({lat:Number(stop.lat),lng:Number(stop.long)});
            out.push({kind:"bus",co:"CTB",coName:"城巴",route:route,stopId:rs.stop,name:stop.name_tc||stop.name_en,nameEn:stop.name_en,lat:Number(stop.lat),lng:Number(stop.long),path:path.slice(-14),dist:Math.round(d),bound:bound,serviceType:"1",dest:bound==="O"?(meta.dest_tc||meta.orig_tc||""):(meta.orig_tc||meta.dest_tc||"")});
          });
        });
        out.sort(function(a,b){return a.dist-b.dist;});
        return pickNearby(out);
      });
    });
  });
}
function isSched(rmk){return /原定|Scheduled/i.test(rmk||"");}
function busEtas(item){
  var url=item.co==="KMB"?KMB+"/eta/"+item.stopId+"/"+item.route+"/"+item.serviceType:CTB+"/eta/CTB/"+item.stopId+"/"+item.route;
  return getJson(url).then(function(j){
    return (j.data||[]).filter(function(x){return !item.bound||!x.dir||x.dir===item.bound;})
      .filter(function(x){return x.eta && new Date(x.eta)>Date.now()-30000;})
      .sort(function(a,b){
        var as=isSched(a.rmk_tc||a.rmk_en)?1:0, bs=isSched(b.rmk_tc||b.rmk_en)?1:0;
        if(as!==bs) return as-bs;
        return new Date(a.eta)-new Date(b.eta);
      })
      .slice(0,3)
      .map(function(x){return {eta:x.eta,dest:x.dest_tc,rmk:x.rmk_tc,sched:isSched(x.rmk_tc||x.rmk_en)};});
  }).catch(function(){return [];});
}

function minsLeft(iso){
  var t=Date.parse(iso);
  if(isNaN(t)) return null;
  return Math.floor((t-Date.now())/60000);
}
function slot(row,i){
  if(!row||(!row.eta && row.ttnt==null && row.ttnt!==0)) return '<div class="slot empty"><div class="lab">第 '+i+' 班</div><div class="big">暫無</div></div>';
  var m=row.ttnt!=null&&row.ttnt!==""?Math.floor(Number(row.ttnt)):minsLeft(row.eta);
  if(m==null) return '<div class="slot empty"><div class="lab">第 '+i+' 班</div><div class="big">暫無</div></div>';
  var big=m<=1?"即將到":(m+"分");
  var klass=row.sched?"sched":(m<=5?"soon":"wait");
  var note=row.sched?"原定班次":(row.rmk||"");
  return '<div class="slot '+klass+'"><div class="lab">第 '+i+' 班</div><div class="big">'+big+'</div><div class="clk">'+(row.eta?clock(row.eta):"—")+'</div></div>';
}

    if(state.tab==="mtr" && c.kind!=="mtr") return false;
    if(on.length && on.length<state.items.length){
      return on.some(function(it){
        if(it.t==="bus") return c.kind==="bus" && String(c.route)===String(it.k);
        return c.kind==="mtr" && (c.stopId===it.k || c.name===labelOf(it));
      });

function busTop(){
  return '<svg viewBox="0 0 28 16" width="28" height="16"><rect x="1" y="3" width="26" height="10" rx="5" fill="#eef2f5" stroke="#c5ccd2"/><rect x="17.5" y="4.4" width="8" height="7.2" rx="2.2" fill="#8fd3ff"/><rect x="4" y="5" width="10" height="6" rx="1.2" fill="#d7dee4"/><circle cx="8" cy="13.2" r="1.6" fill="#2a2e32"/><circle cx="20" cy="13.2" r="1.6" fill="#2a2e32"/></svg>';
}
function headingAt(path,t){
  if(!path||path.length<2) return 0;
  var p=alongPath(path,t), n=alongPath(path,Math.min(1,t+0.04));
  if(!p||!n) return 0;
  return Math.atan2(n.lng-p.lng, n.lat-p.lat)*180/Math.PI;
}
function alongPath(path,t){
  if(!path||!path.length) return null;
  if(path.length===1) return path[0];
  t=Math.max(0,Math.min(1,t));
  var seg=[], tot=0;
  for(var i=1;i<path.length;i++){
    var d=dist(path[i-1].lat,path[i-1].lng,path[i].lat,path[i].lng);
    seg.push(d); tot+=d;
  }
  if(tot<1) return path[path.length-1];
  var target=tot*t, acc=0;
  for(var j=1;j<path.length;j++){
    if(acc+seg[j-1]>=target){
      var r=(target-acc)/Math.max(seg[j-1],1);
      return {lat:path[j-1].lat+(path[j].lat-path[j-1].lat)*r, lng:path[j-1].lng+(path[j].lng-path[j-1].lng)*r};
    }
    acc+=seg[j-1];
  }
  return path[path.length-1];
}
function etaProgress(c){
  var m=999;
  if(c.etas&&c.etas[0]){
    if(c.etas[0].ttnt!=null&&c.etas[0].ttnt!=="") m=Number(c.etas[0].ttnt);
    else if(c.etas[0].eta) m=minsLeft(c.etas[0].eta);
  }
  if(m==null||m<=1) return 0.97;
  var span=Math.max(6,(c.path&&c.path.length||6)*1.6);
  return Math.max(0.08, 1-Math.min(m,span)/span);
}
var miniMaps=[];
function mountCardMaps(cards){
  miniMaps.forEach(function(m){ try{m.remove();}catch(e){} });
  miniMaps=[];
  if(!window.L) return;
  cards.slice(0,6).forEach(function(c,i){
    if(!c.lat||!c.lng) return;
    var el=$("map"+i); if(!el) return;
    var map=L.map(el,{zoomControl:false,attributionControl:false,dragging:true,scrollWheelZoom:false});
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(map);
    var path=c.path&&c.path.length?c.path:[{lat:c.lat,lng:c.lng}];
    if(path.length>1) L.polyline(path.map(function(p){return [p.lat,p.lng];}),{color:"#f0c36a",weight:3,opacity:.75}).addTo(map);
    L.circleMarker([c.lat,c.lng],{radius:6,color:"#fff",fillColor:"#f0c36a",fillOpacity:1,weight:2}).addTo(map);
    var prog=etaProgress(c);
    var pos=alongPath(path, prog)||{lat:c.lat,lng:c.lng};
    var hd=headingAt(path,prog);
    var vhtml='<div class="veh" style="transform:rotate('+hd+'deg)">'+busTop()+'</div>';
    var veh=L.marker([pos.lat,pos.lng],{icon:L.divIcon({className:"",html:vhtml,iconSize:[28,16],iconAnchor:[14,8]})}).addTo(map);
    map.setView([pos.lat,pos.lng],16);
    setTimeout(function(){map.invalidateSize();},120);
    miniMaps.push(map);
    c._veh=veh; c._path=path;
  });
}
function refresh(){
  if(!state.loc){ say("請先設定常用位置或開啟定位"); return; }
  if(state.busy){state.needRefresh=true; return;}
  state.busy=true; renderTags();
  if(!state.items.length){state.cards=[]; paint(); state.busy=false; return;}
  var jobs=state.items.filter(function(x){return x.t==="bus";}).map(function(x){
    return Promise.all([kmbNearby(x.k),ctbNearby(x.k)]).then(function(arr){
      var nearby=arr[0].concat(arr[1]).sort(function(a,b){return a.dist-b.dist;});
      var used={},picked=[];
      nearby.forEach(function(item){
        var dest=(item.etas&&item.etas[0]&&item.etas[0].dest)||item.dest||"";
        var k=item.co+"-"+item.route+"-"+item.bound+"-"+dest;
        if(used[k]) return; used[k]=1; picked.push(item);
      });
      return Promise.all(picked.map(function(item){return busEtas(item).then(function(e){item.etas=e;return item;});}));
    });
  });
  var mtrJobs=state.items.filter(function(x){return x.t==="mtr";}).map(function(x){return mtrCardsFor(x.k);});
  Promise.all(jobs.concat(mtrJobs)).then(function(groups){
    var cards=[].concat.apply([],groups).filter(function(c){return c&&c.etas;});
    function destKey(c){
      var d=(c.etas[0]&&c.etas[0].dest)||c.dest||"";
      return String(d).replace(/[()（）\s]/g,"").replace(/裕民坊|西區|東/g,"");
    }
    function liveScore(c){
      var live=(c.etas||[]).filter(function(e){return e&&e.eta&&!e.sched;}).length;
      return live?0:1;
    }
    var uniq={}, slim=[];
    cards.forEach(function(c){
      var k=c.kind==="mtr"?("mtr-"+c.stopId+"-"+c.route+"-"+destKey(c)):(c.route+"-"+destKey(c));
      var old=uniq[k];
      if(!old){ uniq[k]=c; slim.push(c); return; }
      var names=(old.coName||"")+"／"+(c.coName||"");
      var seen={}; old.coName=names.split("／").filter(function(n){if(!n||seen[n])return 0;seen[n]=1;return 1;}).join("／");
      if(liveScore(c)<liveScore(old) || (liveScore(c)===liveScore(old) && c.dist<old.dist)){
        c.coName=old.coName;
        slim[slim.indexOf(old)]=c; uniq[k]=c;
      }
    });
    cards=slim.filter(function(c){
      if(c.kind!=="bus") return true;
      return (c.etas||[]).some(function(e){return e&&e.eta;});
    });
    cards.sort(function(a,b){
      var ra=String(a.route||""), rb=String(b.route||"");
      if(ra!==rb){
        var na=parseInt(ra,10), nb=parseInt(rb,10);
        if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
        return ra.localeCompare(rb,"zh-HK",{numeric:true});
      }
      function firstMin(c){
        var e=c.etas&&c.etas[0];
        if(!e) return 99999;
        if(e.ttnt!=null&&e.ttnt!=="") return Number(e.ttnt);
        if(e.eta) return (new Date(e.eta)-Date.now())/60000;
        return 99999;
      }
      return firstMin(a)-firstMin(b);
    });
    state.cards=cards; paint();
    say("已更新 "+new Date().toLocaleTimeString("zh-HK",{hour12:false})+" · 與官方公開 ETA 相同來源");
  }).catch(function(){
    say("查詢失敗。請用 Safari 開 github.io 網址，並允許網絡。");
  }).then(function(){state.busy=false; if(state.needRefresh){state.needRefresh=false; refresh();}});
}
renderTags();
if(state.home) $("locLine").textContent="常用位置 · "+state.home.name;
else {
  $("locLine").textContent="未設定常用位置，請開定位或搜尋地點";
  if($("gate")) $("gate").classList.add("on");
  $("homeBtn").classList.remove("on");
}
function tickClock(){
  var now=new Date();
  var t=now.toLocaleTimeString("zh-HK",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:"Asia/Hong_Kong"});
  var d=now.toLocaleDateString("zh-HK",{timeZone:"Asia/Hong_Kong",year:"numeric",month:"numeric",day:"numeric"});
  var w=now.toLocaleDateString("zh-HK",{timeZone:"Asia/Hong_Kong",weekday:"long"});
  if($("nowTime")) $("nowTime").textContent=t;
  if($("nowDate")) $("nowDate").textContent=d+" · "+w;
}
tickClock();
setInterval(tickClock,1000);
loadCatalog().then(function(){ if(state.loc && state.items.length) refresh(); else paint(); });
setInterval(function(){if(state.items.length) refresh();},15000);
setInterval(function(){ if(state.cards&&state.cards.length) paint(); },10000);
})();
</script>
