function $(id){return document.getElementById(id);}
function say(t){$("msg").textContent=t;}
function norm(s){return String(s||"").trim().toUpperCase().replace(/\s+/g,"");}
function dist(a,b,c,d){
  var R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dphi=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
  var x=Math.sin(dphi/2)*Math.sin(dphi/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function getJson(url){
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error(r.status+" "+url);
    return r.json();
  });
}
function clock(iso){
  var d=new Date(iso);
  if(isNaN(d)) return String(iso).slice(11,16);
  return d.toLocaleTimeString("zh-HK",{hour:"2-digit",minute:"2-digit",hour12:false});
}
function minsFromIso(iso){
  var m=Math.round((new Date(iso)-Date.now())/60000);
  return m<=0?"即將到":(m+"分");
}
function persist(){try{localStorage.setItem("watchHistory",JSON.stringify(state.items));}catch(e){}}
function labelOf(it){
  if(it.t==="mtr"){var s=MTR_BY[it.k]; return s?("港鐵 "+s.zh):it.k;}
  return it.k;
}
function renderTags(){
  $("tags").innerHTML=state.items.map(function(it,i){
    return '<span class="tag '+(it.t==="mtr"?"mtr":"")+'"><b>'+labelOf(it)+'</b> <button type="button" data-i="'+i+'">×</button></span>';
  }).join("");
  $("quick").innerHTML=state.items.map(function(it){
    return '<button type="button" class="'+(it.t==="mtr"?"mtr":"")+'" data-hist="'+it.t+':'+it.k+'">'+labelOf(it)+'</button>';
  }).join("");
}
function findMtr(q){
  var raw=String(q||"").trim();
  var u=norm(q);
  var hits=[];
  MTR_STATIONS.forEach(function(s){
    if(s.c===u || s.zh===raw || s.en.toUpperCase().replace(/\s+/g,"")===u || s.zh.indexOf(raw)>=0 && raw.length>=2)
      hits.push(s);
  });
  if(LINE_NAME[u]){
    MTR_STATIONS.forEach(function(s){ if(s.ln.indexOf(u)>=0) hits.push(s); });
  }
  var seen={};
  return hits.filter(function(s){if(seen[s.c])return false;seen[s.c]=1;return true;});
}
function renderSuggest(q){
  var box=$("suggest");
  if(!q){box.style.display="none";box.innerHTML="";return;}
  var hits=[];
  var u=norm(q);
  Object.keys(state.kmbRoutes).forEach(function(r){if(r.indexOf(u)===0) hits.push({t:"bus",k:r,hint:"九巴／龍運"});});
  Object.keys(state.ctbRoutes).forEach(function(r){
    if(r.indexOf(u)===0 && !hits.some(function(h){return h.k===r;})) hits.push({t:"bus",k:r,hint:"城巴"});
  });
  findMtr(q).forEach(function(s){hits.push({t:"mtr",k:s.c,hint:"港鐵 "+s.ln.map(function(l){return LINE_NAME[l]||l;}).join("／")});});
  hits=hits.slice(0,8);
  if(!hits.length){box.style.display="none";box.innerHTML="";return;}
  box.style.display="block";
  box.innerHTML=hits.map(function(h){
    var lab=h.t==="mtr"?("港鐵 "+(MTR_BY[h.k]?MTR_BY[h.k].zh:h.k)):h.k;
    return '<li data-t="'+h.t+'" data-k="'+h.k+'"><strong>'+lab+'</strong><small>'+h.hint+'</small></li>';
  }).join("");
}
function addItem(t,k){
  if(!k) return;
  state.items=state.items.filter(function(x){return !(x.t===t && x.k===k);});
  state.items.unshift({t:t,k:k});
  state.items=state.items.slice(0,12);
  persist(); renderTags();
  $("q").value=""; $("suggest").style.display="none";
  say("已加入 "+(t==="mtr"?("港鐵 "+((MTR_BY[k]||{}).zh||k)):k)+"，正在查附近班次…");
  refresh();
}
function parseQuery(raw){
  var q=String(raw||"").trim();
  if(!q) return null;
  var mtr=findMtr(q);
  if(mtr.length===1) return {t:"mtr",k:mtr[0].c};
  if(mtr.length>1) return {t:"mtr",k:mtr[0].c,many:mtr};
  return {t:"bus",k:norm(q)};
}
function addFromInput(){
  var parsed=parseQuery($("q").value);
  if(!parsed){say("請輸入巴士路線或港鐵站名。");return;}
  if(parsed.many){
    $("suggest").style.display="block";
    $("suggest").innerHTML=parsed.many.map(function(s){
      return '<li data-t="mtr" data-k="'+s.c+'"><strong>港鐵 '+s.zh+'</strong><small>'+s.en+'</small></li>';
    }).join("");
    say("搵到多個港鐵站，請揀一個。");
    return;
  }
  addItem(parsed.t,parsed.k);
}
$("searchForm").addEventListener("submit",function(e){e.preventDefault();addFromInput();});
$("q").addEventListener("input",function(){renderSuggest($("q").value);});
$("suggest").addEventListener("click",function(e){
  var li=e.target.closest("li"); if(!li) return;
  addItem(li.getAttribute("data-t"), li.getAttribute("data-k"));
});
$("tags").addEventListener("click",function(e){
  var i=e.target.getAttribute("data-i"); if(i==null) return;
  state.items.splice(+i,1); persist(); renderTags(); refresh();
});
$("quick").addEventListener("click",function(e){
  var h=e.target.getAttribute("data-hist"); if(!h) return;
  var p=h.split(":"); addItem(p[0], p.slice(1).join(":"));
});
$("demoBtn").onclick=function(){
  state.loc={lat:DEMO.lat,lng:DEMO.lng}; state.mode="demo";
  $("demoBtn").classList.add("on"); $("gpsBtn").classList.remove("on");
  $("locLine").textContent="示範位置 · 麗晶花園13座";
  refresh();
};
$("gpsBtn").onclick=function(){
  if(!navigator.geolocation){say("此瀏覽器不支援定位");return;}
  say("正在要求定位…");
  navigator.geolocation.getCurrentPosition(function(pos){
    state.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
    state.mode="gps";
    $("gpsBtn").classList.add("on"); $("demoBtn").classList.remove("on");
    $("locLine").textContent="已用你而家嘅位置";
    refresh();
  },function(){say("定位失敗，可用示範位置");});
};
function loadCatalog(){
  say("正在載入路線資料…");
  return Promise.all([
    getJson(KMB+"/route"),
    getJson(KMB+"/stop"),
    getJson(CTB+"/route/ctb").catch(function(){return {data:[]};})
  ]).then(function(arr){
    (arr[1].data||[]).forEach(function(s){state.kmbStops[s.stop]=s;});
    (arr[0].data||[]).forEach(function(r){
      var k=String(r.route).toUpperCase();
      if(!state.kmbRoutes[k]) state.kmbRoutes[k]=[];
      state.kmbRoutes[k].push(r);
    });
    (arr[2].data||[]).forEach(function(r){state.ctbRoutes[String(r.route).toUpperCase()]=r;});
    say(state.items.length?"資料已載入，正在更新班次…":"資料已載入。輸入路線或港鐵站名再加入。");
  }).catch(function(){say("目錄載入不完整，仍可直接搜尋。");});
}
function getKmbStop(id){
  if(state.kmbStops[id]) return Promise.resolve(state.kmbStops[id]);
  return getJson(KMB+"/stop/"+id).then(function(j){
    if(j.data) state.kmbStops[id]=j.data;
    return j.data||null;
  }).catch(function(){return null;});
}
function kmbNearby(route){
  var variants=state.kmbRoutes[route]||[{bound:"O",service_type:"1"},{bound:"I",service_type:"1"}];
  var tasks=variants.map(function(v){
    var dir=v.bound==="I"?"inbound":"outbound";
    var stype=v.service_type||"1";
    return getJson(KMB+"/route-stop/"+route+"/"+dir+"/"+stype).then(function(j){
      return {v:v,rows:j.data||[]};
    }).catch(function(){return {v:v,rows:[]};});
  });
  return Promise.all(tasks).then(function(parts){
    var ids=[];
    parts.forEach(function(p){p.rows.forEach(function(rs){if(ids.indexOf(rs.stop)<0) ids.push(rs.stop);});});
    return Promise.all(ids.map(getKmbStop)).then(function(){
      var all=[], seen={};
      parts.forEach(function(p){
        p.rows.forEach(function(rs){
          var stop=state.kmbStops[rs.stop]; if(!stop) return;
          var d=dist(state.loc.lat,state.loc.lng,Number(stop.lat),Number(stop.long));
          var key=rs.stop+"-"+p.v.bound; if(seen[key]) return; seen[key]=1;
          all.push({kind:"bus",co:"KMB",coName:"九巴／龍運",route:route,stopId:rs.stop,name:stop.name_tc,nameEn:stop.name_en,dist:Math.round(d),bound:p.v.bound,serviceType:String(p.v.service_type||"1"),dest:p.v.dest_tc||""});
        });
      });
      all.sort(function(a,b){return a.dist-b.dist;});
      var inRange=all.filter(function(x){return x.dist<=BUS_MAX;});
      return inRange.length?inRange:all.slice(0,2);
    });
  });
}
var ctbStopCache={};
function ctbNearby(route){
  var meta=state.ctbRoutes[route];
  if(!meta) return Promise.resolve([]);
  var dirs=["outbound","inbound"];
  return Promise.all(dirs.map(function(dir){
    return getJson(CTB+"/route-stop/CTB/"+route+"/"+dir).then(function(j){return {dir:dir,rows:j.data||[]};}).catch(function(){return {dir:dir,rows:[]};});
  })).then(function(parts){
    var stopIds=[];
    parts.forEach(function(p){p.rows.forEach(function(rs){if(stopIds.indexOf(rs.stop)<0) stopIds.push(rs.stop);});});
    return Promise.all(stopIds.map(function(id){
      if(ctbStopCache[id]) return Promise.resolve([id,ctbStopCache[id]]);
      return getJson(CTB+"/stop/"+id).then(function(j){ctbStopCache[id]=j.data;return [id,j.data];}).catch(function(){return [id,null];});
    })).then(function(pairs){
      pairs.forEach(function(p){ctbStopCache[p[0]]=p[1];});
      var out=[],seen={};
      parts.forEach(function(p){
        var bound=p.dir==="inbound"?"I":"O";
        p.rows.forEach(function(rs){
          var stop=ctbStopCache[rs.stop]; if(!stop||!stop.lat) return;
          var d=dist(state.loc.lat,state.loc.lng,Number(stop.lat),Number(stop.long));
          var key=rs.stop+"-"+bound; if(seen[key]) return; seen[key]=1;
          out.push({kind:"bus",co:"CTB",coName:"城巴",route:route,stopId:rs.stop,name:stop.name_tc,nameEn:stop.name_en,dist:Math.round(d),bound:bound,serviceType:"1",dest:bound==="O"?meta.dest_tc:meta.orig_tc});
        });
      });
      out.sort(function(a,b){return a.dist-b.dist;});
      var inRange=out.filter(function(x){return x.dist<=BUS_MAX;});
      return inRange.length?inRange:out.slice(0,2);
    });
  });
}
function busEtas(item){
  var url=item.co==="KMB"
    ? KMB+"/eta/"+item.stopId+"/"+item.route+"/"+item.serviceType
    : CTB+"/eta/CTB/"+item.stopId+"/"+item.route;
  return getJson(url).then(function(j){
    return (j.data||[]).filter(function(x){return !item.bound||!x.dir||x.dir===item.bound;})
      .filter(function(x){return x.eta && new Date(x.eta)>Date.now()-20000;})
      .sort(function(a,b){return new Date(a.eta)-new Date(b.eta);})
      .slice(0,3)
      .map(function(x){return {eta:x.eta,dest:x.dest_tc,rmk:x.rmk_tc};});
  }).catch(function(){return [];});
}
function mtrCardsFor(code){
  var sta=MTR_BY[code]; if(!sta) return Promise.resolve([]);
  var d=dist(state.loc.lat,state.loc.lng,sta.lat,sta.lng);
  return Promise.all(sta.ln.map(function(line){
    return getJson(MTR_ETA+"?line="+line+"&sta="+code).then(function(j){
      var pack=(j.data||{})[line+"-"+code]||{};
      var cards=[];
      ["UP","DOWN"].forEach(function(dir){
        var rows=(pack[dir]||[]).filter(function(x){return x.valid!=="N";}).slice(0,3);
        if(!rows.length) return;
        cards.push({
          kind:"mtr", co:"MTR", coName:"港鐵 "+(LINE_NAME[line]||line),
          route:LINE_NAME[line]||line, stopId:code, name:sta.zh, nameEn:sta.en,
          dist:Math.round(d), dest:(MTR_BY[rows[0].dest]||{}).zh||rows[0].dest,
          etas:rows.map(function(x){
            return {eta:x.time, dest:(MTR_BY[x.dest]||{}).zh||x.dest, rmk:(x.plat?("月台 "+x.plat):""), ttnt:x.ttnt};
          })
        });
      });
      return cards;
    }).catch(function(){return [];});
  })).then(function(groups){return [].concat.apply([],groups);});
}
function nearbyMtrWatched(){
  var wanted={};
  state.items.forEach(function(it){if(it.t==="mtr") wanted[it.k]=1;});
  if(!Object.keys(wanted).length){
    // still show nearest MTR if user only searched buses? no, only watched
    return Promise.resolve([]);
  }
  var jobs=[];
  Object.keys(wanted).forEach(function(code){jobs.push(mtrCardsFor(code));});
  return Promise.all(jobs).then(function(g){return [].concat.apply([],g);});
}
function slot(row,i){
  if(!row||(!row.eta && row.ttnt==null)) return '<div class="slot empty"><div class="lab">第 '+i+' 班</div><div class="big">暫無</div><div class="clk">—</div></div>';
  var big=row.ttnt!=null?(Number(row.ttnt)<=0?"即將到":(row.ttnt+"分")):minsFromIso(row.eta);
  var m=row.ttnt!=null?Number(row.ttnt):Math.round((new Date(row.eta)-Date.now())/60000);
  var klass=m<=5?"soon":"wait";
  return '<div class="slot '+klass+'"><div class="lab">第 '+i+' 班</div><div class="big">'+big+'</div><div class="clk">'+(row.eta?clock(row.eta):"—")+(row.rmk?(" · "+row.rmk):"")+'</div></div>';
}
function renderCards(cards){
  if(!state.items.length){
    $("feed").innerHTML='<div class="card">輸入巴士路線（九巴／城巴）或港鐵站名，加入後會顯示附近到站時間。最近搜尋會留低做快捷鍵。</div>';
    return;
  }
  if(!cards.length){
    $("feed").innerHTML='<div class="card">已加入項目，但附近未搵到班次。可開定位或行近啲站再試。</div>';
    return;
  }
  $("feed").innerHTML=cards.map(function(c){
    var dest=(c.etas[0]&&c.etas[0].dest)||c.dest||"—";
    return '<article class="card"><div class="to">往<br><b style="color:#fff">'+dest+'</b></div><div class="badge '+(c.kind==="mtr"?"rail":"")+'">'+c.coName+'</div><div class="bus">'+c.route+'</div><div class="stop">'+c.name+'</div><div class="dist">'+c.dist+' 米 · '+(c.nameEn||"")+'</div><div class="times">'+[0,1,2].map(function(i){return slot(c.etas[i],i+1);}).join("")+'</div></article>';
  }).join("");
}
function refresh(){
  if(state.busy) return;
  state.busy=true;
  renderTags();
  if(!state.items.length){renderCards([]);state.busy=false;return;}
  var busRoutes=state.items.filter(function(x){return x.t==="bus";}).map(function(x){return x.k;});
  var jobs=busRoutes.map(function(route){
    return Promise.all([kmbNearby(route),ctbNearby(route)]).then(function(arr){
      var nearby=arr[0].concat(arr[1]).sort(function(a,b){return a.dist-b.dist;});
      var used={},picked=[];
      nearby.forEach(function(item){
        var k=item.co+"-"+item.bound;
        if(used[k]) return; used[k]=1; picked.push(item);
      });
      return Promise.all(picked.map(function(item){
        return busEtas(item).then(function(e){item.etas=e;return item;});
      }));
    });
  });
  jobs.push(nearbyMtrWatched());
  Promise.all(jobs).then(function(groups){
    var cards=[].concat.apply([],groups);
    cards.sort(function(a,b){return a.dist-b.dist;});
    renderCards(cards);
    say(cards.length?("已更新 "+new Date().toLocaleTimeString("zh-HK",{hour12:false})):"附近暫時沒有班次");
  }).catch(function(){
    say("查詢失敗。請用 Safari 以 https 網址開啟。");
    $("feed").innerHTML='<div class="card">網絡被擋或未用 Safari 開啟。</div>';
  }).then(function(){state.busy=false;});
}
renderTags();
loadCatalog().then(function(){if(state.items.length) refresh(); else renderCards([]);});
setInterval(function(){if(state.items.length) refresh();},30000);
})();
</script>
